name: Job Crawler — 10-Minute Cron

# Runs every 10 minutes — bypasses Vercel Hobby's once-per-day cron limit.
# This is the PRIMARY cron driver for the job ingestion pipeline.
#
# Flow per tick:
#   1. POST /api/cron/tick  → enqueues due tasks into Postgres queue
#   2. Fire N workers in parallel → each dequeues 5 tasks (each = 5 companies)
#   3. Report summary to job log
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions → New secret):
#   CRON_SECRET          — same value as CRON_SECRET in your Vercel environment
#   NEXT_PUBLIC_APP_URL  — your production URL, e.g. https://aladdin-testing.vercel.app

on:
  schedule:
    - cron: '*/10 * * * *'   # Every 10 minutes, 24/7
  workflow_dispatch:           # Manual trigger from GitHub UI (for testing)

jobs:
  crawl:
    name: Tick & Fan-out Workers
    runs-on: ubuntu-latest
    timeout-minutes: 8        # Safety: kill if GitHub Actions itself hangs

    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_URL:     ${{ secrets.NEXT_PUBLIC_APP_URL }}
      # Number of parallel workers to fire after the tick
      # Each worker dequeues 5 tasks; each task polls 5 companies in parallel
      # → 5 workers × 5 tasks × 5 companies = up to 125 company polls per tick
      WORKER_COUNT: 12 # Higher throughput to clear queue backlogs faster

    steps:
      - name: "① Enqueue — POST /api/cron/tick"
        id: tick
        run: |
          echo "🕐 Triggering tick at $APP_URL..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "$APP_URL/api/cron/tick" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time 30)

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "⚠️  Tick returned non-200 ($HTTP_CODE). Workers will still run to drain existing queue."
          else
            echo "✅ Tick succeeded"
          fi

          # Extract pending count from response for logging
          PENDING=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('pending', d.get('queue',{}).get('pending','?')))" 2>/dev/null || echo "?")
          echo "📊 Queue pending: $PENDING tasks"
          echo "pending=$PENDING" >> $GITHUB_OUTPUT

      - name: "② Fan-out — Fire ${{ env.WORKER_COUNT }} workers in parallel"
        run: |
          echo "🚀 Firing $WORKER_COUNT workers in parallel..."

          fire_worker() {
            local N=$1
            local RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST "$APP_URL/api/worker/process" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              --max-time 15 2>&1)

            local HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            local BODY=$(echo "$RESPONSE" | head -n-1)
            local NEW_JOBS=$(echo "$BODY" | python3 -c "import sys,json; r=json.load(sys.stdin).get('results',[]); print(sum(x.get('newJobs',0) for x in r))" 2>/dev/null || echo "?")

            echo "Worker #$N → HTTP $HTTP_CODE | new jobs: $NEW_JOBS"
          }

          export -f fire_worker
          export APP_URL CRON_SECRET

          # Spawn workers in parallel, wait for all
          for i in $(seq 1 $WORKER_COUNT); do
            fire_worker $i &
          done
          wait

          echo "✅ All workers completed"

      - name: "③ Summary"
        if: always()
        run: |
          echo "============================================"
          echo "  Job Crawler Tick Complete"
          echo "  Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "  Queue pending before tick: ${{ steps.tick.outputs.pending }}"
          echo "============================================"
